name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libpcap-dev
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            install: sudo apt-get update && sudo apt-get install -y libpcap-dev
          - name: darwin-arm64
            runner: macos-latest
            install: brew install libpcap
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install libpcap
        run: ${{ matrix.install }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build
